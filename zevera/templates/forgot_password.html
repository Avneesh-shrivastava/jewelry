<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — Maison Aurée</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
      --gold: #c9a962;
      --gold-dark: #a88b4a;
      --rose: #b76e79;
      --ink: #1a1a1a;
      --ink-soft: #4a4a4a;
      --cream: #faf8f5;
      --white: #ffffff;
      --border: #e8e4df;
      --shadow: 0 4px 24px rgba(26, 26, 26, 0.08);
      --shadow-lg: 0 12px 48px rgba(26, 26, 26, 0.12);
      --radius: 4px;
      --transition: 0.3s ease;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Montserrat', sans-serif; color: var(--ink); background: var(--cream); line-height: 1.6; }
    a { text-decoration: none; color: inherit; }

    .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1.25rem; }
    .auth-card { width: 100%; max-width: 400px; background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: 2.25rem 1.75rem; }

    .auth-logo { text-align: center; font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; font-weight: 700; margin-bottom: 1.75rem; }
    .auth-logo span { color: var(--gold); }

    .auth-icon {
      width: 52px; height: 52px; border-radius: 50%; background: var(--cream); margin: 0 auto 1.25rem;
      display: flex; align-items: center; justify-content: center;
    }
    .auth-icon svg { width: 24px; height: 24px; color: var(--gold-dark); }

    .auth-title { font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; font-weight: 600; text-align: center; margin-bottom: 0.5rem; }
    .auth-subtitle { font-size: 0.8rem; color: var(--ink-soft); text-align: center; margin-bottom: 1.75rem; line-height: 1.7; }

    .field-group { margin-bottom: 1.1rem; }
    .field-label { display: block; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 0.4rem; }
    .field-input {
      width: 100%; padding: 0.8rem 0.95rem; border: 1px solid var(--border); border-radius: var(--radius);
      font-family: inherit; font-size: 0.85rem; outline: none; transition: border-color var(--transition); background: var(--white); color: var(--ink);
    }
    .field-input:focus { border-color: var(--gold); }
    .field-error { font-size: 0.7rem; color: var(--rose); margin-top: 0.4rem; }
    .field-help { font-size: 0.7rem; color: var(--ink-soft); margin-top: 0.4rem; }

    .btn-primary {
      width: 100%; padding: 0.9rem; background: var(--gold); color: var(--white); border: none; border-radius: var(--radius);
      font-size: 0.72rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; transition: background var(--transition);
      margin-top: 0.4rem;
    }
    .btn-primary:hover { background: var(--gold-dark); }

    .auth-back { display: block; text-align: center; font-size: 0.75rem; color: var(--ink-soft); margin-top: 1.5rem; }
    .auth-back:hover { color: var(--gold-dark); }
    .auth-back svg { width: 12px; height: 12px; vertical-align: -1px; margin-right: 0.3rem; }

    .messages { margin-bottom: 1.1rem; }
    .messages p { font-size: 0.78rem; padding: 0.7rem 0.9rem; border-radius: var(--radius); margin-bottom: 0.5rem; }
    .messages .error { background: rgba(183, 110, 121, 0.1); color: var(--rose); }
    .messages .success { background: rgba(111, 156, 118, 0.12); color: #4d7a54; }
</style>
</head>
<body>

  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">Maison <span>Aurée</span></div>

      <div class="auth-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
      </div>

      <h1 class="auth-title">Forgot Your Password?</h1>
      <p class="auth-subtitle">Enter the email address linked to your account and we'll send you a link to reset your password.</p>

      {% if messages %}
      <div class="messages">
        {% for message in messages %}
        <p class="{{ message.tags }}">{{ message }}</p>
        {% endfor %}
      </div>
      {% endif %}

      <form method="POST" action="{% url 'forgot_password' %}">
        {% csrf_token %}
        <div class="field-group">
          <label class="field-label" for="email">Email Address</label>
          <input type="email" id="email" name="email" class="field-input" placeholder="you@example.com" required>
        </div>

        <button type="submit" class="btn-primary">Send Reset Link</button>
      </form>

      <a href="{% url 'login' %}" class="auth-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>Back to Login
      </a>
    </div>
  </div>

</body>
</html>
