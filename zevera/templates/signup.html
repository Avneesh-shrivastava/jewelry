<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — Maison Aurée</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
      --gold: #c9a962;
      --gold-dark: #a88b4a;
      --rose: #b76e79;
      --ink: #1a1a1a;
      --ink-soft: #4a4a4a;
      --cream: #faf8f5;
      --white: #ffffff;
      --border: #e8e4df;
      --shadow-lg: 0 12px 48px rgba(26, 26, 26, 0.12);
      --radius: 4px;
      --transition: 0.3s ease;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Montserrat', sans-serif; color: var(--ink); background: var(--cream); line-height: 1.6; }
    a { text-decoration: none; color: inherit; }

    .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1.25rem; }
    .auth-card { width: 100%; max-width: 420px; background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: 2.25rem 1.75rem; }

    .auth-logo { text-align: center; font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem; }
    .auth-logo span { color: var(--gold); }

    .auth-title { font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; font-weight: 600; text-align: center; margin-bottom: 0.4rem; }
    .auth-subtitle { font-size: 0.8rem; color: var(--ink-soft); text-align: center; margin-bottom: 1.75rem; }

    .messages p { font-size: 0.78rem; padding: 0.7rem 0.9rem; border-radius: var(--radius); margin-bottom: 1rem; }
    .messages .error { background: rgba(183, 110, 121, 0.1); color: var(--rose); }
    .messages .success { background: rgba(111, 156, 118, 0.12); color: #4d7a54; }

    .field-group { margin-bottom: 1.1rem; }
    .field-label { display: block; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 0.4rem; }
    .field-input {
      width: 100%; padding: 0.8rem 0.95rem; border: 1px solid var(--border); border-radius: var(--radius);
      font-family: inherit; font-size: 0.85rem; outline: none; transition: border-color var(--transition); background: var(--white); color: var(--ink);
    }
    .field-input:focus { border-color: var(--gold); }
    .field-help { font-size: 0.7rem; color: var(--ink-soft); margin-top: 0.4rem; }

    .btn-primary {
      width: 100%; padding: 0.9rem; background: var(--gold); color: var(--white); border: none; border-radius: var(--radius);
      font-size: 0.72rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; transition: background var(--transition);
      margin-top: 0.4rem;
    }
    .btn-primary:hover { background: var(--gold-dark); }

    .auth-switch { text-align: center; font-size: 0.78rem; color: var(--ink-soft); margin-top: 1.5rem; }
    .auth-switch a { color: var(--gold-dark); font-weight: 600; }
</style>
</head>
<body>

  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">Maison <span>Aurée</span></div>
      <h1 class="auth-title">Create Your Account</h1>
      <p class="auth-subtitle">Join us for early access to new collections and faster checkout.</p>

      {% if messages %}
      <div class="messages">
        {% for message in messages %}
        <p class="{{ message.tags }}">{{ message }}</p>
        {% endfor %}
      </div>
      {% endif %}

      <form method="POST" action="{% url 'signup' %}">
        {% csrf_token %}

        <div class="field-group">
          <label class="field-label" for="username">Username</label>
          <input type="text" id="username" name="username" class="field-input" value="{{ username|default:'' }}" required>
        </div>

        <div class="field-group">
          <label class="field-label" for="email">Email</label>
          <input type="email" id="email" name="email" class="field-input" value="{{ email|default:'' }}" required>
        </div>

        <div class="field-group">
          <label class="field-label" for="password1">Password</label>
          <input type="password" id="password1" name="password1" class="field-input" required>
          <p class="field-help">At least 8 characters.</p>
        </div>

        <div class="field-group">
          <label class="field-label" for="password2">Confirm Password</label>
          <input type="password" id="password2" name="password2" class="field-input" required>
        </div>

        <button type="submit" class="btn-primary">Create Account</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="{% url 'login' %}">Log In</a></p>
    </div>
  </div>

</body>
</html>
